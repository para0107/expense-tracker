[project]
name = "expense-tracker"
version = "0.1.0"
description = "Personal expense tracker REST API"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "pydantic-settings",
    "pydantic[email]",
    "pyjwt",
    "argon2-cffi",
    "python-multipart",
    "apscheduler",
]

[dependency-groups]
dev = ["ruff", "pytest", "pytest-asyncio", "httpx"]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
